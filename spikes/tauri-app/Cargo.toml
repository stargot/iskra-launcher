[package]
name = "wrc-spike"
version = "0.1.0"
edition = "2021"
description = "Phase-0 spike: Tauri 2 shell latency + clipboard (see docs/specs/2026-09-17-windows-raycast-clone-spec.md §4.2)"

[dependencies]
tauri = "2"
tauri-plugin-global-shortcut = "2"
window-vibrancy = "0.8.0"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_Ole"] }

[build-dependencies]
tauri-build = "2"
