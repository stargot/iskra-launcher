[workspace]
resolver = "2"
members = ["crates/iskra-core", "crates/iskra-sys", "app"]

[workspace.dependencies]
# Внутренние крейты
iskra-core = { path = "crates/iskra-core" }
iskra-sys = { path = "crates/iskra-sys" }

# Общие зависимости (версии из spikes/tauri-app/Cargo.lock — проверены фазой 0)
serde = "1"
serde_json = "1"
dirs = "6"
windows = "0.62.2"
tauri = "2.11"
tauri-build = "2"
tauri-plugin-global-shortcut = "2"
window-vibrancy = "=0.8.0"

# Фаза 2, шаг 0 (пре-чек сборкой под vcvars64, 2026-09-30).
# rusqlite 0.39 — максимум, поддерживаемый refinery-core 0.9 (req ">=0.23, <=0.39");
# 0.40 развёл бы две копии rusqlite и сломал передачу Connection в refinery.
rusqlite = "0.39"
refinery = { version = "0.9", default-features = false, features = ["rusqlite"] }
parselnk = "0.1"
meval = "0.2"
image = { version = "0.25", default-features = false, features = ["png"] }

[profile.release]
# Лончер: меньше бинарник — меньше резидентных страниц (критерий RAM ≤ 80 МБ).
strip = true
